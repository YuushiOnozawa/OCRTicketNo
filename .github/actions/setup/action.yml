name: Setup Node & pnpm
description: Checkout, install pnpm and Node.js, run pnpm install

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: '11'
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - run: pnpm install
      shell: bash
